<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Details</title>
    <link href="personaldetails.css" rel="stylesheet">
</head>
<body>
    <h1>Personal Details Form</h1>
    <form>
        <label>Name</label><br>
        <input type="text" id="name"><br><br>
        <label>Email ID</label><br>
        <input type="password" id="contact"><br><br>
        <label>Gender</label><br>
        <input type="radio" id="female">Female<br>
        <input type="radio" id="male">Male<br><br>
        <label>Favourite City</label><br>
        <input type="checkbox" id="City" value="Mumbai">Mumbai<br>
        <input type="checkbox" id="City" value="New Dehli">New Dehli<br><br>
        <input type="submit">
    </form>
    
</body>
</html>
