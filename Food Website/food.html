<!DOCTYPE html>
<html lang="en">
<head>

    <title>Food</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fffaf0;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            text-shadow: -1px -1px 0 black,
                         1px -1px 0 black,
                        -1px  1px 0 black,
                         1px  1px 0 black;
            background-color: beige;
            padding: 20px;
            color: aliceblue;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        nav ul li {
            margin: 15px;
        }

        nav ul li a {
            text-decoration: none;
            font-size: 20px;
            color: darkgreen;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: brown;
        }
    </style>
</head>
<body>

<header>
    <h1>Most Popular Dishes Across The World</h1>
</header>

<section>
    <h3>Cuisine Types</h3>
    <nav>
        <ul>
            <li><a href="indianfood.html">Indian Cuisine</a></li>
            <li><a href="mexican.html">Mexican Cuisine</a></li>

    </nav>

</html>
